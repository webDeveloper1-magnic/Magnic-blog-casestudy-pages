    <!-- Browser tab icon: the Magnic "M" mark cropped out of logo2 so it stays
         legible at 16px — the full logo's wordmark is unreadable at that size.
         Browsers that honour `media` get the white mark on dark tab bars. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-blue-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-blue-16.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      media="(prefers-color-scheme: dark)"
      href="/favicon-white-32.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-blue-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Magnic Technologies — Blog and Case Studies page prototype for review." />
